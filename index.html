<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Flick Football Chaos</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wrap">
  <div id="startScreen">
    <div id="startCard">
      <h1 id="startTitle">Flick Football Chaos</h1>

      <div id="modeStep">
        <div id="modeRow">
          <button id="pickSingle" type="button">
            <span class="modeIcon">&#9917;</span>
            <span class="modeName">One match</span>
            <span class="modeHint">Just play</span>
          </button>
          <button id="pickCup" type="button">
            <span class="modeIcon">&#127942;</span>
            <span class="modeName">Tournament</span>
            <span class="modeHint">Win the cup</span>
          </button>
        </div>
      </div>

      <div id="teamStep" class="hidden">
        <p class="caption">Choose your team</p>
        <div id="slotRow"></div>
        <div id="cupProgress">
          <div id="trophyShelf"></div>
          <div id="cupPips"></div>
        </div>
        <button id="nextUnlock" type="button" class="hidden" title="Locker" aria-label="Next unlock">
          <canvas id="nextUnlockArt" width="44" height="44"></canvas>
        </button>
        <div id="startButtons">
          <button id="startBack" type="button" aria-label="Back">&#8592;</button>
          <button id="startGo" type="button" aria-label="Play">&#9654;</button>
          <button id="startStats" type="button" title="Stats" aria-label="Stats">&#128202;</button>
          <button id="startLocker" type="button" title="Locker" aria-label="Locker">&#127933;</button>
        </div>
      </div>
    </div>
  </div>

  <header id="hud">
    <span class="team blue">YOU <b id="scoreHuman">0</b></span>
    <span id="turnMsg" class="human">Your turn</span>
    <span class="team red"><b id="scoreAi">0</b> CPU</span>
  </header>

  <div id="stage">
    <canvas id="game" width="600" height="900"></canvas>
    <button id="fsBtn" type="button" title="Fullscreen (F)" aria-label="Toggle fullscreen">&#9974;</button>
    <div id="chaosBanner" class="hidden"></div>
    <div id="goalFlash" class="hidden">GOAL!</div>
    <div id="quiz" class="hidden">
      <div id="quizLead">Answer for a bonus</div>
      <div id="quizPrize">
        <div id="quizPrizeGlyph"></div>
        <div id="quizPrizePreview"></div>
      </div>
      <div id="quizQ"></div>
      <div id="quizChoices"></div>
      <button id="quizSkip" type="button" aria-label="Skip">&#8618;</button>
    </div>
    <div id="teamEditor" class="hidden">
      <div id="teamCard">
        <p class="caption">Pick a badge</p>
        <div id="badgeGrid"></div>
        <p class="caption">Team name</p>
        <div id="teamNameRow">
          <input id="teamName" type="text" maxlength="12" placeholder="&#9917;" aria-label="Team name">
          <button id="teamDice" type="button" title="Another name" aria-label="Another name">&#127922;</button>
        </div>
        <div id="agePanel">
        <p class="caption">How old are you?</p>
        <div id="ageLead">
          <span class="cake">&#127874;</span>
          <span id="ageValue">7</span>
        </div>
        <div id="teamAges" title="Age">
          <button type="button" class="ageBtn" data-band="1">5</button>
          <button type="button" class="ageBtn" data-band="2">6</button>
          <button type="button" class="ageBtn" data-band="3">7</button>
          <button type="button" class="ageBtn" data-band="4">8</button>
          <button type="button" class="ageBtn" data-band="5">9</button>
          <button type="button" class="ageBtn" data-band="6">10</button>
          <button type="button" class="ageBtn" data-band="7">11</button>
          <button type="button" class="ageBtn" data-band="8">12</button>
          <button type="button" class="ageBtn" data-band="0" title="No maths" aria-label="No maths">&#128683;</button>
        </div>
        </div>
        <div id="teamButtons">
          <button id="teamDelete" type="button" aria-label="Delete team">&#128465;</button>
          <button id="teamCancel" type="button" aria-label="Back">&#10005;</button>
          <button id="teamOk" type="button">&#10004;</button>
        </div>
      </div>
    </div>

    <div id="statsPanel" class="hidden">
      <div id="statsCard">
        <div id="statsWho"></div>
        <p class="caption">This team so far</p>
        <div id="statsGrid"></div>
        <button id="statsClose" type="button" aria-label="Back">&#10005;</button>
      </div>
    </div>

    <div id="lockerPanel" class="hidden">
      <div id="lockerCard">
        <div id="lockerWho"></div>
        <p class="caption">Your locker</p>
        <div class="lockerGrid" id="lockerBall"></div>
        <div class="lockerGrid" id="lockerHat"></div>
        <div class="lockerGrid" id="lockerPitch"></div>
        <button id="lockerClose" type="button" aria-label="Back">&#10005;</button>
      </div>
    </div>

    <div id="bracket" class="hidden">
      <div id="bracketCard">
        <div id="bracketTitle">&#127942;</div>
        <p class="caption" id="bracketCaption">Next match</p>
        <div id="bracketTie">
          <div class="side"><span class="bdg" id="tieMe"></span><span class="nm" id="tieMeName"></span></div>
          <div class="vs"><span id="tieRound">&#127942;</span></div>
          <div class="side"><span class="bdg" id="tieFoe"></span><span class="nm" id="tieFoeName"></span></div>
        </div>
        <div id="bracketRounds"></div>
        <div id="bracketTree"></div>
        <div id="bracketButtons">
          <button id="bracketBack" type="button" aria-label="Back">&#8592;</button>
          <button id="roundGo" type="button">&#9654;</button>
        </div>
      </div>
    </div>

    <div id="overlay" class="hidden">
      <div id="overCard">
        <h1 id="overTitle">You Win!</h1>
        <p id="overSub"></p>
        <div id="overUnlocks" class="hidden">
          <p class="caption">Unlocked!</p>
          <div id="overUnlockRow"></div>
        </div>
        <button id="again">Play Again</button>
      </div>
    </div>
  </div>

  <footer id="hint">Drag a blue player back &amp; release to flick &mdash; first to 3 goals wins!</footer>
</div>
<script src="maths.js"></script>
<script src="names.js"></script>
<script src="store.js"></script>
<script src="locker.js"></script>
<script src="tournament.js"></script>
<script src="quiz.js"></script>
<script src="formation.js"></script>
<script src="game.js"></script>
</body>
</html>
